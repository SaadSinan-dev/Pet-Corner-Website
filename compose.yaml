services:
  api:
    build: ./api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set the Supabase runtime connection}
      DIRECT_URL: ${DIRECT_URL:?Set the Supabase session/direct migration connection}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?Set ORDER_TOKEN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the actual storefront origin}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set the actual storefront URL}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:?Set the actual administration URL}
      STORAGE_PROVIDER: supabase
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the backend-only key}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-product-images}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    command: ["npm", "run", "start:production"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  web:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
  admin:
    build:
      context: ./admin
      args:
        VITE_ADMIN_API_BASE_URL: /api/v1
        VITE_ADMIN_SITE_URL: ${ADMIN_PUBLIC_URL:?Set ADMIN_PUBLIC_URL}
        VITE_STOREFRONT_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
