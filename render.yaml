# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free API only. Supabase database/storage are created separately by the owner.
services:
  - type: web
    name: pet-corner-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:production
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ORDER_TOKEN_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-images
      - key: CORS_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: ADMIN_PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        sync: false
